@import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
.arch-flow{font-family:'Chakra Petch',ui-sans-serif,system-ui,sans-serif}
.arch-mono{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace}

.arch-flow .react-flow__handle{opacity:0;width:7px;height:7px;min-width:0;min-height:0;border:0;transition:opacity .15s}
.arch-flow .react-flow__node:hover>.arch-node>.react-flow__handle,
.arch-flow .react-flow__node.selected .react-flow__handle{opacity:.95}
.arch-flow .react-flow__node:focus-visible{outline:2px solid #67e8f9;outline-offset:3px;border-radius:14px}

.arch-flow .react-flow__controls{border:1px solid rgba(34,211,238,.28);border-radius:10px;overflow:hidden;
  background:rgba(2,6,23,.7);backdrop-filter:blur(8px);box-shadow:0 0 24px rgba(34,211,238,.08)}
.arch-flow .react-flow__controls-button{background:transparent;border-bottom:1px solid rgba(34,211,238,.14);color:#67e8f9;width:30px;height:30px}
.arch-flow .react-flow__controls-button:hover{background:rgba(34,211,238,.14)}
.arch-flow .react-flow__minimap{border:1px solid rgba(34,211,238,.28);border-radius:12px;overflow:hidden;
  background:rgba(2,6,23,.8);box-shadow:0 0 24px rgba(34,211,238,.08)}
.arch-flow .react-flow__attribution{background:transparent;color:#475569}
.arch-flow .react-flow__attribution a{color:#64748b}

.arch-ring{position:absolute;inset:-1px;border-radius:12px;border:1px solid;pointer-events:none;animation:arch-ring 1.7s ease-out infinite}
@keyframes arch-ring{from{transform:scale(1);opacity:.75}to{transform:scale(1.1,1.28);opacity:0}}

.arch-glow{animation:arch-glow 1.6s ease-in-out infinite}
.arch-dot{animation:arch-glow 1s ease-in-out infinite;box-shadow:0 0 8px #ef4444}
@keyframes arch-glow{0%,100%{opacity:.35}50%{opacity:1}}
.arch-march{animation:arch-march .9s linear infinite}
@keyframes arch-march{to{stroke-dashoffset:-11px}}

.arch-beam{animation:arch-beam linear infinite}
.arch-head{animation:arch-head linear infinite}
@keyframes arch-beam{from{stroke-dashoffset:var(--beam)}to{stroke-dashoffset:calc(var(--len) * -1)}}
@keyframes arch-head{from{stroke-dashoffset:${sT}px}to{stroke-dashoffset:calc(var(--len) * -1 - var(--beam) + ${sT}px)}}

@media (prefers-reduced-motion:reduce){.arch-beam,.arch-head,.arch-march,.arch-ring,.arch-glow,.arch-dot{animation:none!important}}
