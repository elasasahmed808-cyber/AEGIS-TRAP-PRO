<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AegisTrap – Security Architecture Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#040a1a;--ink:#eaf3ff;--mut:#8fb0e0;--cy:#22e6ff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#040a1a;--ink:#eaf3ff;--mut:#8fb0e0;--cy:#22e6ff}}
:root[data-theme="dark"]{--bg:#040a1a;--ink:#eaf3ff;--mut:#8fb0e0;--cy:#22e6ff}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Chakra Petch",system-ui,sans-serif;overflow:hidden;display:flex;flex-direction:column;
background-image:radial-gradient(ellipse at 50% 45%,#0b1f4a 0%,transparent 70%),linear-gradient(rgba(80,140,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(80,140,255,.06) 1px,transparent 1px);background-size:100% 100%,44px 44px,44px 44px}
header{padding:22px 32px 0;min-height:112px}
h1{font-size:clamp(22px,3.4vw,38px);font-weight:700;letter-spacing:.01em;transition:opacity .4s,filter .4s}
header p{margin-top:8px;font-size:clamp(13px,1.5vw,16px);color:var(--mut);max-width:68ch;line-height:1.5;transition:opacity .4s,filter .4s}
header.out h1,header.out p{opacity:0;filter:blur(6px)}
main{flex:1;min-height:0;display:flex;cursor:pointer}
svg{width:100%;height:100%}
#st{transition:opacity .42s,filter .42s,transform .42s;transform-origin:50% 50%}
#st.out{opacity:0;filter:blur(10px);transform:scale(1.05)}
nav{display:flex;gap:8px;padding:6px 24px 18px;justify-content:center;flex-wrap:wrap}
nav button{font:inherit;font-size:13px;color:var(--mut);background:rgba(34,230,255,.06);border:1px solid rgba(120,170,255,.25);border-radius:999px;padding:7px 14px;cursor:pointer;position:relative;overflow:hidden}
nav button:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
nav button.on{color:#fff;border-color:var(--cy)}
nav button.on::after{content:"";position:absolute;left:0;bottom:0;height:3px;background:var(--cy);box-shadow:0 0 8px var(--cy);animation:fill var(--d) linear forwards}
body.paused nav button.on::after{animation-play-state:paused}
@keyframes fill{from{width:0}to{width:100%}}
#hint{position:fixed;right:20px;bottom:64px;font-size:12px;color:var(--mut);opacity:.7}
.star{position:fixed;right:22px;bottom:90px;color:#3b6bd6;font-size:26px;opacity:.5}
.grp rect{fill:rgba(34,230,255,.035);stroke:rgba(120,170,255,.4);stroke-width:1.5}
.grp text{fill:var(--mut);font-size:14px;font-weight:700}
.grp{animation:fade .8s backwards}
@keyframes fade{from{opacity:0}}
.eb{fill:none;stroke-width:2.2;opacity:.55;stroke-dasharray:1;animation:dr 1.1s ease-out backwards}
@keyframes dr{from{stroke-dashoffset:1}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.2,1.5,.4,1) backwards}
@keyframes pop{from{opacity:0;transform:scale(.35)}}
.nl{fill:var(--ink);font-size:13px;font-weight:700;text-anchor:middle}
.el{fill:#bfe9ff;font-size:12px;text-anchor:middle;stroke:var(--bg);stroke-width:5px;paint-order:stroke;animation:fade 1s 1.4s backwards}
.ping{fill:none;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ping 2s ease-out infinite}
@keyframes ping{from{transform:scale(.9);opacity:.8}to{transform:scale(1.9);opacity:0}}
.brand{animation:fade 1s .4s backwards}
@media (prefers-reduced-motion:reduce){.pop,.eb,.grp,.ping,.el,.brand{animation:none}#st{transition:none}}
</style>
</head>

function tick(t){if(!paused)for(const k of pk){if(t<k.t0){continue}const u=RM?k.o:(((t-k.t0)/k.d)+k.o)%1,l=u*k.len,a=k.p.getPointAtLength(l),b=k.p.getPointAtLength(Math.min(k.len,l+2)),ang=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;
k.g.setAttribute('transform',`translate(${a.x} ${a.y}) rotate(${ang})`);k.g.style.opacity=Math.min(1,u*10,(1-u)*10)}requestAnimationFrame(tick)}
function overview(){const pos=i=>[25+(i%3)*325,92+Math.floor(i/3)*225];let h='';
S.forEach((s,i)=>{const[x,y]=pos(i);h+=`<g transform="translate(${x} ${y})"><rect width="300" height="190" rx="12" fill="rgba(34,230,255,.04)" stroke="rgba(120,170,255,.4)"/><text x="14" y="-9" fill="#eaf3ff" font-size="15" font-weight="700">${s.k}</text><g transform="translate(0 8) scale(.3)">${build(s)}</g></g>`});
const[x,y]=pos(5);h+=`<g class="brand" transform="translate(${x} ${y})"><rect width="300" height="190" rx="12" fill="rgba(34,230,255,.08)" stroke="#22e6ff"/><text x="150" y="95" text-anchor="middle" fill="#fff" font-size="40" font-weight="700" filter="url(#gl)">AegisTrap</text><text x="150" y="126" text-anchor="middle" fill="#8fb0e0" font-size="14">Detect · Respond · Trap</text></g>`;return h}
function show(i){clearTimeout(tm);idx=(i+6)%6;const hd=$('#hd');hd.classList.add('out');st.classList.add('out');
setTimeout(()=>{$('#t').textContent=T[idx][1];$('#c').textContent=T[idx][2];hd.classList.remove('out');st.innerHTML=idx<5?build(S[idx]):overview();packets();st.classList.remove('out');
document.querySelectorAll('nav button').forEach((b,j)=>{b.classList.toggle('on',j==idx);b.style.setProperty('--d',dur(j)+'ms')});
if(!paused)tm=setTimeout(()=>show(idx+1),dur(idx))},430)}
$('#nv').innerHTML=T.map((t,i)=>`<button>${t[0]}</button>`).join('');
document.querySelectorAll('nav button').forEach((b,i)=>b.onclick=()=>{paused=false;document.body.classList.remove('paused');show(i)});
$('#m').onclick=()=>{paused=!paused;document.body.classList.toggle('paused',paused);if(!paused)tm=setTimeout(()=>show(idx+1),2500)};
addEventListener('keydown',e=>{if(e.key=='ArrowRight')show(idx+1);if(e.key=='ArrowLeft')show(idx-1);if(e.key==' '){e.preventDefault();$('#m').click()}});
show(0);requestAnimationFrame(tick);
